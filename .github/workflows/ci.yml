name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm test
      - name: Content check
        run: npm run content:check
      - name: Contrast check
        run: npm run contrast:check
      - name: Installer lint
        run: npm run installer:lint
      - name: Build (Pages base path)
        run: npm run build

  # Section 12 (P1): Playwright drives the production build in Chromium. playwright.config.ts builds
  # the app with base "/" and serves it with vite preview; the report is kept when a run fails.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Parse both installer scripts and run PSScriptAnalyzer on Windows before anything reaches main, so the
  # post-deploy installer job in deploy.yml never meets a static problem for the first time.
  installer-static:
    name: Installer static checks (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
            label: Windows PowerShell 5.1
          - shell: pwsh
            label: PowerShell 7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5
      - name: Parse both scripts
        run: |
          foreach ($file in 'install.ps1', 'uninstall.ps1') {
            $tokens = $null
            $parseErrors = $null
            $path = (Resolve-Path -LiteralPath $file).Path
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref] $tokens, [ref] $parseErrors)
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                Write-Host "$($file):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              }
              throw "$file doesn't parse under PowerShell $($PSVersionTable.PSVersion)."
            }
            Write-Host "$file parses under PowerShell $($PSVersionTable.PSVersion)."
          }

      - name: Analyse both scripts with PSScriptAnalyzer
        run: |
          # Rules left out on purpose. Keep this list short, with a reason for each.
          #  - PSAvoidUsingWriteHost: both scripts talk to a person at a console, and coloured text is the point.
          $excludedRules = @('PSAvoidUsingWriteHost')
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            if ($PSVersionTable.PSEdition -eq 'Desktop') {
              # Windows PowerShell 5.1 needs the NuGet provider before it can install from the Gallery.
              $null = Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
            }
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          Import-Module -Name PSScriptAnalyzer
          Write-Host "PSScriptAnalyzer $((Get-Module -Name PSScriptAnalyzer).Version)"
          $findings = @()
          foreach ($file in 'install.ps1', 'uninstall.ps1') {
            $findings += @(Invoke-ScriptAnalyzer -Path $file -ExcludeRule $excludedRules)
          }
          # Information findings are shown but don't fail the job. Errors, warnings and parse errors do.
          $findings | Format-Table -Property ScriptName, Line, Severity, RuleName, Message -AutoSize -Wrap | Out-String -Width 400 | Write-Host
          $blocking = @($findings | Where-Object { $_.Severity -ne 'Information' })
          if ($blocking.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($blocking.Count) error(s) or warning(s)."
          }
          Write-Host 'PSScriptAnalyzer reported no errors or warnings.'
