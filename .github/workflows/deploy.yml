name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm test
      - name: Content check
        run: npm run content:check
      - name: Contrast check
        run: npm run contrast:check
      - name: Installer lint
        run: npm run installer:lint
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Section 11.2: check both installer scripts on a real Windows machine against the site that was just
  # deployed, once under Windows PowerShell 5.1 and once under PowerShell 7.
  installer:
    name: Installer (${{ matrix.label }})
    needs: deploy
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
            edition: Desktop
            label: Windows PowerShell 5.1
          - shell: pwsh
            edition: Core
            label: PowerShell 7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # Create the shortcuts but don't open a browser window on the runner.
      COLDBOOT_NO_LAUNCH: '1'
      EXPECTED_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the PowerShell version
        run: |
          $PSVersionTable | Format-Table -AutoSize | Out-String | Write-Host
          $version = $PSVersionTable.PSVersion
          if ($PSVersionTable.PSEdition -ne $env:EXPECTED_EDITION) {
            throw "Expected the $env:EXPECTED_EDITION edition of PowerShell, but this is $($PSVersionTable.PSEdition) $version."
          }
          if (($env:EXPECTED_EDITION -eq 'Desktop' -and $version.Major -ne 5) -or ($env:EXPECTED_EDITION -eq 'Core' -and $version.Major -lt 7)) {
            throw "PowerShell $version isn't the version this leg is meant to test."
          }

      - name: Parse both scripts
        run: |
          foreach ($file in 'install.ps1', 'uninstall.ps1') {
            $tokens = $null
            $parseErrors = $null
            $path = (Resolve-Path -LiteralPath $file).Path
            $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref] $tokens, [ref] $parseErrors)
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                Write-Host "$($file):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              }
              throw "$file doesn't parse under PowerShell $($PSVersionTable.PSVersion)."
            }
            Write-Host "$file parses under PowerShell $($PSVersionTable.PSVersion)."
          }

      - name: Analyse both scripts with PSScriptAnalyzer
        run: |
          # Rules left out on purpose. Keep this list short, with a reason for each.
          #  - PSAvoidUsingWriteHost: both scripts talk to a person at a console, and coloured text is the point.
          $excludedRules = @('PSAvoidUsingWriteHost')
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            if ($PSVersionTable.PSEdition -eq 'Desktop') {
              # Windows PowerShell 5.1 needs the NuGet provider before it can install from the Gallery.
              $null = Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
            }
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          Import-Module -Name PSScriptAnalyzer
          Write-Host "PSScriptAnalyzer $((Get-Module -Name PSScriptAnalyzer).Version)"
          $findings = @()
          foreach ($file in 'install.ps1', 'uninstall.ps1') {
            $findings += @(Invoke-ScriptAnalyzer -Path $file -ExcludeRule $excludedRules)
          }
          # Information findings are shown but don't fail the job. Errors, warnings and parse errors do.
          $findings | Format-Table -Property ScriptName, Line, Severity, RuleName, Message -AutoSize -Wrap | Out-String -Width 400 | Write-Host
          $blocking = @($findings | Where-Object { $_.Severity -ne 'Information' })
          if ($blocking.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($blocking.Count) error(s) or warning(s)."
          }
          Write-Host 'PSScriptAnalyzer reported no errors or warnings.'

      - name: Install, repair and uninstall the way a student does
        run: |
          $pagesUrl = 'https://psdachyexe.github.io/coldboot/'
          $expectedArguments = '--app=https://psdachyexe.github.io/coldboot/ --profile-directory=Default'
          $installDir = Join-Path -Path $env:LOCALAPPDATA -ChildPath 'COLDBOOT'
          $iconPath = Join-Path -Path $installDir -ChildPath 'coldboot.ico'
          $shell = New-Object -ComObject WScript.Shell

          function Assert-That([bool] $Condition, [string] $What) {
            if (-not $Condition) { throw "Failed: $What" }
            Write-Host "ok: $What"
          }

          function Get-ShortcutPath([string] $Folder, [string] $Extension) {
            Join-Path -Path ([Environment]::GetFolderPath($Folder)) -ChildPath "COLDBOOT.$Extension"
          }

          # How a student runs a script, minus the download: its text piped to Invoke-Expression.
          function Invoke-Script([string] $File) {
            Write-Host "> Get-Content -Raw $File | Invoke-Expression"
            $output = @(Get-Content -Raw -LiteralPath $File | Invoke-Expression)
            Assert-That ($output.Count -eq 0) "$File writes nothing to the pipeline"
          }

          function Assert-EdgeShortcuts {
            foreach ($folder in 'Desktop', 'Programs') {
              $lnk = Get-ShortcutPath $folder 'lnk'
              Assert-That (Test-Path -LiteralPath $lnk) "$lnk exists"
              $shortcut = $shell.CreateShortcut($lnk)
              Assert-That ($shortcut.TargetPath.EndsWith('msedge.exe', [StringComparison]::OrdinalIgnoreCase)) "its target ends with msedge.exe ($($shortcut.TargetPath))"
              Assert-That ($shortcut.Arguments -ceq $expectedArguments) "its arguments are exactly '$expectedArguments' (got '$($shortcut.Arguments)')"
              # Windows may store the icon path with variables such as %USERPROFILE%, so expand it first.
              $icon = [Environment]::ExpandEnvironmentVariables($shortcut.IconLocation)
              Assert-That ($icon -eq "$iconPath,0") "its icon is $iconPath (got '$icon')"
              Assert-That (-not (Test-Path -LiteralPath (Get-ShortcutPath $folder 'url'))) "there's no .url shortcut beside it"
            }
            Assert-That (Test-Path -LiteralPath $iconPath -PathType Leaf) "$iconPath exists"
          }

          function Assert-Uninstalled {
            foreach ($folder in 'Desktop', 'Programs') {
              foreach ($extension in 'lnk', 'url') {
                $path = Get-ShortcutPath $folder $extension
                Assert-That (-not (Test-Path -LiteralPath $path)) "$path is gone"
              }
            }
            Assert-That (-not (Test-Path -LiteralPath $installDir)) "$installDir is gone"
          }

          Write-Host '::group::Install with Microsoft Edge'
          Invoke-Script 'install.ps1'
          Assert-EdgeShortcuts
          Write-Host '::endgroup::'

          Write-Host '::group::Run the installer again to repair damaged shortcuts'
          Remove-Item -LiteralPath (Get-ShortcutPath 'Desktop' 'lnk')
          $damaged = $shell.CreateShortcut((Get-ShortcutPath 'Programs' 'lnk'))
          $damaged.Arguments = '--app=https://example.invalid/'
          $damaged.Save()
          Invoke-Script 'install.ps1'
          Assert-EdgeShortcuts
          Write-Host '::endgroup::'

          Write-Host '::group::Uninstall, then uninstall again with nothing left'
          Invoke-Script 'uninstall.ps1'
          Assert-Uninstalled
          Invoke-Script 'uninstall.ps1'
          Assert-Uninstalled
          Write-Host '::endgroup::'

          Write-Host '::group::Install without a Chromium browser, over an Edge install'
          Invoke-Script 'install.ps1'
          $env:COLDBOOT_NO_CHROMIUM = '1'
          Invoke-Script 'install.ps1'
          foreach ($folder in 'Desktop', 'Programs') {
            $url = Get-ShortcutPath $folder 'url'
            Assert-That (Test-Path -LiteralPath $url) "$url exists"
            $lines = @(Get-Content -LiteralPath $url)
            Assert-That ($lines -contains "URL=$pagesUrl") "it opens $pagesUrl"
            Assert-That ($lines -contains "IconFile=$iconPath") "its icon is $iconPath"
            Assert-That (-not (Test-Path -LiteralPath (Get-ShortcutPath $folder 'lnk'))) 'the Edge shortcut beside it is gone'
          }
          Invoke-Script 'uninstall.ps1'
          Assert-Uninstalled
          Remove-Item -LiteralPath Env:COLDBOOT_NO_CHROMIUM
          Write-Host '::endgroup::'
